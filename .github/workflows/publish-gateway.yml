name: Publish HomeProxy gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.tonisives.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: gateway
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.tonisives.com/homeproxy-gateway:pilot
            registry.tonisives.com/homeproxy-gateway:${{ github.sha }}
